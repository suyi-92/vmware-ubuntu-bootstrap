name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install static analysis dependency
        run: sudo apt-get update && sudo apt-get install -y iproute2 shellcheck

      - name: Run unprivileged test suite
        run: bash tests/run.sh

      - name: Verify backup and rollback as root
        run: sudo bash tests/test_backup_rollback.sh

      - name: Verify status commands are read-only
        run: sudo bash tests/test_status_read_only.sh

      - name: Run root preflight in dry-run mode
        run: sudo bash tests/test_preflight_dry_run.sh
